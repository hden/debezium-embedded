version: 2
jobs:
  build:
    docker:
      - image: cimg/clojure:1.12.5-openjdk-25.0
      - image: debezium/example-postgres:3.0.0.Final
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    working_directory: ~/repo
    environment:
      LEIN_ROOT: "true"
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "project.clj" }}-{{ checksum "deps.edn" }}
            - v2-dependencies-{{ checksum "project.clj" }}-
      - run: lein deps
      - run: lein test
      - run: make quality
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
            - ~/.clojure/.cpcache
          key: v2-dependencies-{{ checksum "project.clj" }}-{{ checksum "deps.edn" }}
